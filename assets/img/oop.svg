<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" role="img" aria-labelledby="oopTitle">
  <title id="oopTitle">Схема классов: базовый класс Игрок и два наследника — Снайпер и Стример</title>

  <defs>
    <marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7194"/>
    </marker>
    <clipPath id="clipBase"><rect x="350" y="96" width="240" height="166" rx="10"/></clipPath>
    <clipPath id="clipL"><rect x="110" y="360" width="240" height="140" rx="10"/></clipPath>
    <clipPath id="clipR"><rect x="590" y="360" width="240" height="140" rx="10"/></clipPath>
  </defs>

  <rect width="940" height="540" fill="#F8F6FC"/>
  <text x="24" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1B1725">Класс — чертёж, объекты — детали по этому чертежу</text>
  <text x="24" y="66" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5F5872">Наследник получает все поля и методы родителя и добавляет свои.</text>

  <!-- Базовый класс -->
  <g clip-path="url(#clipBase)">
    <rect x="350" y="96" width="240" height="50" fill="#F1E4F6"/>
  </g>
  <rect x="350" y="96" width="240" height="166" rx="10" fill="none" stroke="#68217A" stroke-width="1.8"/>
  <line x1="350" y1="146" x2="590" y2="146" stroke="#68217A" stroke-width="1.3"/>
  <line x1="350" y1="204" x2="590" y2="204" stroke="#68217A" stroke-width="1.3"/>
  <text x="470" y="122" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#4C1557">Игрок</text>
  <text x="470" y="139" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4C1557">class Player</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#1B1725">
    <text x="364" y="168">− balance : decimal</text>
    <text x="364" y="188">− nick : string</text>
    <text x="364" y="226">+ ОткрытьКейс() : void</text>
    <text x="364" y="246">+ Продать(decimal) : void</text>
  </g>

  <!-- Наследование -->
  <path d="M230 358 L230 316 L420 316 L420 282" fill="none" stroke="#7A7194" stroke-width="1.6"/>
  <polygon points="408,282 432,282 420,264" fill="#F8F6FC" stroke="#68217A" stroke-width="1.6"/>
  <path d="M710 358 L710 316 L520 316 L520 282" fill="none" stroke="#7A7194" stroke-width="1.6"/>
  <polygon points="508,282 532,282 520,264" fill="#F8F6FC" stroke="#68217A" stroke-width="1.6"/>

  <!-- Снайпер -->
  <g clip-path="url(#clipL)">
    <rect x="110" y="360" width="240" height="50" fill="#E4F2EF"/>
  </g>
  <rect x="110" y="360" width="240" height="140" rx="10" fill="none" stroke="#0E7C6B" stroke-width="1.8"/>
  <line x1="110" y1="410" x2="350" y2="410" stroke="#0E7C6B" stroke-width="1.3"/>
  <line x1="110" y1="456" x2="350" y2="456" stroke="#0E7C6B" stroke-width="1.3"/>
  <text x="230" y="386" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#0A5A4E">Снайпер</text>
  <text x="230" y="403" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0A5A4E">class Sniper : Player</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#1B1725">
    <text x="122" y="432">+ accuracy : int</text>
    <text x="122" y="478">+ Прицелиться() : void</text>
  </g>

  <!-- Стример -->
  <g clip-path="url(#clipR)">
    <rect x="590" y="360" width="240" height="50" fill="#FBEBE0"/>
  </g>
  <rect x="590" y="360" width="240" height="140" rx="10" fill="none" stroke="#A9501A" stroke-width="1.8"/>
  <line x1="590" y1="410" x2="830" y2="410" stroke="#A9501A" stroke-width="1.3"/>
  <line x1="590" y1="456" x2="830" y2="456" stroke="#A9501A" stroke-width="1.3"/>
  <text x="710" y="386" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#8A3F12">Стример</text>
  <text x="710" y="403" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#8A3F12">class Streamer : Player</text>
  <g font-family="Consolas, monospace" font-size="11" fill="#1B1725">
    <text x="602" y="432">+ viewers : int</text>
    <text x="602" y="472">+ ОткрытьКейс() : void</text>
    <text x="602" y="490" font-size="10" fill="#A9501A">override</text>
  </g>

  <!-- Легенда -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">
    <text x="24" y="520">− приватное, + публичное. Треугольник — «наследует»: острие всегда смотрит на родителя.</text>
  </g>
</svg>
