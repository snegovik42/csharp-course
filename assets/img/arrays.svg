<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-labelledby="arrTitle">
  <title id="arrTitle">Массив фиксированной длины и список, который растёт</title>

  <rect width="900" height="430" fill="#F8F6FC"/>
  <text x="24" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1B1725">Массив и список: в чём разница</text>

  <!-- Массив -->
  <rect x="24" y="60" width="852" height="166" rx="12" fill="#FFFFFF" stroke="#D8D2E8" stroke-width="1.5"/>
  <text x="44" y="94" font-family="Consolas, monospace" font-size="12.5" fill="#1B1725">int[] scores = new int[5];</text>
  <text x="856" y="94" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">длина задана заранее</text>

  <!-- скобки -->
  <path d="M40 112 L32 112 L32 200 L40 200" fill="none" stroke="#68217A" stroke-width="2.2"/>
  <path d="M392 112 L400 112 L400 200 L392 200" fill="none" stroke="#68217A" stroke-width="2.2"/>

  <g font-family="Consolas, monospace">
    <g>
      <rect x="44" y="112" width="66" height="88" rx="6" fill="#FBFAFE" stroke="#D8D2E8" stroke-width="1.3"/>
      <text x="77" y="132" text-anchor="middle" font-size="10.5" fill="#8A829C">[0]</text>
      <text x="77" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1725">5</text>
    </g>
    <g>
      <rect x="114" y="112" width="66" height="88" rx="6" fill="#FBFAFE" stroke="#D8D2E8" stroke-width="1.3"/>
      <text x="147" y="132" text-anchor="middle" font-size="10.5" fill="#8A829C">[1]</text>
      <text x="147" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1725">4</text>
    </g>
    <g>
      <rect x="184" y="112" width="66" height="88" rx="6" fill="#FBFAFE" stroke="#D8D2E8" stroke-width="1.3"/>
      <text x="217" y="132" text-anchor="middle" font-size="10.5" fill="#8A829C">[2]</text>
      <text x="217" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1725">3</text>
    </g>
    <g>
      <rect x="254" y="112" width="66" height="88" rx="6" fill="#FBFAFE" stroke="#D8D2E8" stroke-width="1.3"/>
      <text x="287" y="132" text-anchor="middle" font-size="10.5" fill="#8A829C">[3]</text>
      <text x="287" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1725">5</text>
    </g>
    <g>
      <rect x="324" y="112" width="66" height="88" rx="6" fill="#FBFAFE" stroke="#D8D2E8" stroke-width="1.3"/>
      <text x="357" y="132" text-anchor="middle" font-size="10.5" fill="#8A829C">[4]</text>
      <text x="357" y="172" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1725">4</text>
    </g>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">
    <text x="430" y="140">Пять ячеек — пять значений.</text>
    <text x="430" y="162">Индексы начинаются с нуля,</text>
    <text x="430" y="184">scores[5] уже ошибка.</text>
  </g>

  <!-- Список -->
  <rect x="24" y="242" width="852" height="166" rx="12" fill="#FFFFFF" stroke="#D8D2E8" stroke-width="1.5"/>
  <text x="44" y="276" font-family="Consolas, monospace" font-size="12.5" fill="#1B1725">List&lt;string&gt; names = new List&lt;string&gt;();</text>
  <text x="856" y="276" text-anchor="end" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">длина меняется на ходу</text>

  <g font-family="Consolas, monospace">
    <rect x="44" y="294" width="110" height="60" rx="6" fill="#E4F2EF" stroke="#0E7C6B" stroke-width="1.4"/>
    <text x="99" y="329" text-anchor="middle" font-size="12.5" fill="#0A5A4E">«sneg»</text>

    <rect x="160" y="294" width="110" height="60" rx="6" fill="#E4F2EF" stroke="#0E7C6B" stroke-width="1.4"/>
    <text x="215" y="329" text-anchor="middle" font-size="12.5" fill="#0A5A4E">«mark»</text>

    <rect x="276" y="294" width="110" height="60" rx="6" fill="#E4F2EF" stroke="#0E7C6B" stroke-width="1.4"/>
    <text x="331" y="329" text-anchor="middle" font-size="12.5" fill="#0A5A4E">«dasha»</text>

    <rect x="392" y="294" width="110" height="60" rx="6" fill="none" stroke="#0E7C6B" stroke-width="1.4" stroke-dasharray="6 5"/>
    <text x="447" y="331" text-anchor="middle" font-size="18" fill="#0E7C6B">+</text>
  </g>

  <g font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">
    <text x="530" y="312">names.Add(«sneg») добавляет элемент в конец.</text>
    <text x="530" y="334">names.Count всегда знает актуальную длину,</text>
    <text x="530" y="356">а память под новые ячейки выделяется сама.</text>
  </g>
</svg>
