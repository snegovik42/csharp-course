<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 310" width="940" height="310" role="img" aria-labelledby="exTitle">
  <title id="exTitle">Путь исключения через try, catch и finally</title>

  <defs>
    <marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7194"/>
    </marker>
    <marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0E7C6B"/>
    </marker>
  </defs>

  <rect width="940" height="310" fill="#F8F6FC"/>
  <text x="24" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1B1725">Путь исключения через try / catch / finally</text>
  <text x="24" y="64" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5F5872">Ошибка прерывает блок try и передаёт управление ближайшему подходящему catch.</text>

  <!-- try -->
  <rect x="24" y="104" width="170" height="80" rx="10" fill="#FFFFFF" stroke="#D8D2E8" stroke-width="1.5"/>
  <text x="109" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#1B1725">try</text>
  <text x="109" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5F5872">{ ... }</text>

  <line x1="194" y1="144" x2="244" y2="144" stroke="#7A7194" stroke-width="1.8" marker-end="url(#a8)"/>
  <text x="219" y="132" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#A9501A">throw</text>

  <!-- catch -->
  <rect x="250" y="104" width="186" height="80" rx="10" fill="#FBEBE0" stroke="#A9501A" stroke-width="1.8"/>
  <text x="343" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#8A3F12">catch (Exception)</text>
  <text x="343" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8A3F12">разбираемся с ошибкой</text>

  <line x1="436" y1="144" x2="486" y2="144" stroke="#7A7194" stroke-width="1.8" marker-end="url(#a8)"/>

  <!-- finally -->
  <rect x="492" y="104" width="160" height="80" rx="10" fill="#DFF3EE" stroke="#0E7C6B" stroke-width="1.8"/>
  <text x="572" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="600" fill="#0A5A4E">finally</text>
  <text x="572" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#0A5A4E">чистим за собой</text>

  <line x1="652" y1="144" x2="702" y2="144" stroke="#7A7194" stroke-width="1.8" marker-end="url(#a8)"/>

  <!-- дальше -->
  <rect x="708" y="104" width="208" height="80" rx="10" fill="#FFFFFF" stroke="#D8D2E8" stroke-width="1.5"/>
  <text x="812" y="140" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1B1725">программа живёт дальше</text>
  <text x="812" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">без аварийного завершения</text>

  <!-- путь без исключения -->
  <path d="M109 184 L109 236 L572 236 L572 190" fill="none" stroke="#0E7C6B" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a9)"/>
  <text x="340" y="258" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#0A5A4E">исключения не было — finally всё равно выполнится</text>

  <text x="24" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5F5872">Если подходящего catch нет, исключение всплывает выше по стеку — вплоть до падения всей программы.</text>
</svg>
