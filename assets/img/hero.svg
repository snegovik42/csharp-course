<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Редактор с кодом на C# и консоль с результатом запуска</title>
  <desc id="heroDesc">Слева окно редактора с файлом Program.cs, справа консоль, где после команды dotnet run выводится приветствие.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#68217A"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#F8F6FC"/>
  <circle cx="812" cy="76" r="120" fill="#EFE7F7"/>
  <circle cx="70" cy="392" r="90" fill="#E4F2EF"/>

  <!-- Окно редактора -->
  <rect x="40" y="58" width="500" height="304" rx="14" fill="#191524" stroke="#332A46" stroke-width="1.5"/>
  <rect x="40" y="58" width="500" height="34" rx="14" fill="#221C31"/>
  <rect x="40" y="76" width="500" height="16" fill="#221C31"/>
  <circle cx="64" cy="75" r="5" fill="#E06C75"/>
  <circle cx="84" cy="75" r="5" fill="#E5C07B"/>
  <circle cx="104" cy="75" r="5" fill="#98C379"/>
  <text x="126" y="80" font-family="Consolas, 'Cascadia Mono', monospace" font-size="12" fill="#8E85A8">Program.cs</text>
  <text x="516" y="80" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#6A6184">C#</text>

  <!-- Код -->
  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="13.5" fill="#E9E3F4">
    <text x="62" y="122"><tspan fill="#D18BE8">using</tspan> System;</text>
    <text x="62" y="166"><tspan fill="#D18BE8">class</tspan> <tspan fill="#7FD3C8">Program</tspan></text>
    <text x="62" y="188">{</text>
    <text x="62" y="210">    <tspan fill="#D18BE8">static</tspan> <tspan fill="#D18BE8">void</tspan> <tspan fill="#7FD3C8">Main</tspan>()</text>
    <text x="62" y="232">    {</text>
    <text x="62" y="254">        <tspan fill="#7FD3C8">Console</tspan>.<tspan fill="#7FD3C8">WriteLine</tspan>(<tspan fill="#9ED97F">"Привет, мир!"</tspan>);</text>
    <text x="62" y="276">    }</text>
    <text x="62" y="298">}</text>
  </g>

  <!-- Строка состояния -->
  <rect x="40" y="330" width="500" height="32" rx="14" fill="#221C31"/>
  <rect x="40" y="330" width="500" height="14" fill="#221C31"/>
  <line x1="40" y1="330" x2="540" y2="330" stroke="#332A46" stroke-width="1"/>
  <text x="62" y="351" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#8E85A8">Ln 9, Col 1</text>
  <text x="518" y="351" text-anchor="end" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#8E85A8">C#   UTF-8   CRLF</text>

  <!-- Стрелка -->
  <line x1="552" y1="210" x2="606" y2="210" stroke="#68217A" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="579" y="196" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#5F5872">dotnet run</text>
  <text x="579" y="234" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="11" fill="#8A829C">компиляция</text>

  <!-- Консоль -->
  <rect x="618" y="112" width="242" height="168" rx="12" fill="#FFFFFF" stroke="#D8D2E8" stroke-width="1.5"/>
  <rect x="618" y="112" width="242" height="30" rx="12" fill="#F1EDF8"/>
  <rect x="618" y="128" width="242" height="14" fill="#F1EDF8"/>
  <text x="634" y="132" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#5F5872">Терминал</text>

  <g font-family="Consolas, 'Cascadia Mono', monospace" font-size="13">
    <text x="636" y="176" fill="#8A829C">C:\course&gt; dotnet run</text>
    <text x="636" y="210" fill="#1E7A46">Привет, мир!</text>
    <text x="636" y="250" fill="#8A829C">C:\course&gt; <tspan fill="#68217A">▌</tspan></text>
  </g>

  <!-- Подпись -->
  <text x="618" y="312" font-family="'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#5F5872">Один файл — одна запускаемая программа</text>
</svg>
